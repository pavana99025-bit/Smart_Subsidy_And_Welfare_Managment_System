<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Government Official Registration - SevaSindu Portal</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="register-container">
        <div class="register-box">
            <div class="register-header">
                <div class="register-icon">🏛️</div>
                <h2>Government Official Registration</h2>
                <p>Register as a government official</p>
            </div>
            <form class="register-form" id="officialRegisterForm">
                <div class="form-group">
                    <label for="officialFullName">Full Name</label>
                    <input type="text" id="officialFullName" name="fullName" required>
                </div>
                <div class="form-group">
                    <label for="officialEmployeeId">Employee ID</label>
                    <input type="text" id="officialEmployeeId" name="employeeId" required>
                </div>
                <div class="form-group">
                    <label for="officialDepartment">Department</label>
                    <input type="text" id="officialDepartment" name="department" required>
                </div>
                <div class="form-group">
                    <label for="officialDesignation">Designation</label>
                    <input type="text" id="officialDesignation" name="designation" required>
                </div>
                <div class="form-group">
                    <label for="officialPhone">Phone Number</label>
                    <input type="tel" id="officialPhone" name="phone" pattern="[0-9]{10}" maxlength="10" required>
                </div>
                <div class="form-group">
                    <label for="officialEmail">Official Email Address</label>
                    <input type="email" id="officialEmail" name="email" required>
                </div>
                <div class="form-group">
                    <label for="officialRegUsername">Username</label>
                    <input type="text" id="officialRegUsername" name="username" required>
                </div>
                <div class="form-group">
                    <label for="officialRegPassword">Password</label>
                    <input type="password" id="officialRegPassword" name="password" minlength="6" required>
                </div>
                <div class="form-group">
                    <label for="officialConfirmPassword">Confirm Password</label>
                    <input type="password" id="officialConfirmPassword" name="confirmPassword" required>
                </div>
                <button type="submit" class="register-btn">Register</button>
            </form>
            <div class="login-link">
                <p>Already have an account?</p>
                <a href="login-official.html">Login Here</a>
            </div>
            <div class="back-home">
                <a href="index.html">← Back to Home</a>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
