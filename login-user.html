<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Normal User Login - SevaSindu Portal</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <div class="login-icon">👤</div>
                <h2>Normal User Portal</h2>
                <p>Login to access government services</p>
            </div>
            <form class="login-form" id="userLoginForm">
                <div class="form-group">
                    <label for="userUsername">Username / Email</label>
                    <input type="text" id="userUsername" name="username" required>
                </div>
                <div class="form-group">
                    <label for="userPassword">Password</label>
                    <input type="password" id="userPassword" name="password" required>
                </div>
                <button type="submit" class="login-btn">Login</button>
            </form>
            <div class="register-link">
                <p>Don't have an account?</p>
                <a href="register-user.html">Register Now</a>
            </div>
            <div class="back-home">
                <a href="index.html">← Back to Home</a>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
