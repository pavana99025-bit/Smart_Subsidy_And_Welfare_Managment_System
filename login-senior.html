<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senior Citizen Login - SevaSindu Portal</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <div class="login-icon">👴</div>
                <h2>Senior Citizen Portal</h2>
                <p>Login to access your dedicated services</p>
            </div>
            <form class="login-form" id="seniorLoginForm">
                <div class="form-group">
                    <label for="seniorUsername">Username / Aadhaar Number</label>
                    <input type="text" id="seniorUsername" name="username" required>
                </div>
                <div class="form-group">
                    <label for="seniorPassword">Password</label>
                    <input type="password" id="seniorPassword" name="password" required>
                </div>
                <button type="submit" class="login-btn">Login</button>
            </form>
            <div class="register-link">
                <p>Don't have an account?</p>
                <a href="register-senior.html">Register Now</a>
            </div>
            <div class="back-home">
                <a href="index.html">← Back to Home</a>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
